image: node:24-alpine

stages:
  - verify

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  before_script:
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
    - npm test
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
      - dist-server/
