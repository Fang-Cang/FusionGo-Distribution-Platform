version: '3.8'

services:
  fusiongo-app:
    build: .  # 基于当前目录的 Dockerfile 构建
    image: fusiongo-distribution-platform:latest
    container_name: fusiongo-app
    restart: unless-stopped
    ports:
      - "8787:8787" # 映射到你的 ENV PORT=8787
    environment:
      # === 运行模式 ===
      NODE_ENV: production
      FCG_MODE: ${FCG_MODE:-sandbox}
      FCG_ENV: ${FCG_ENV:-sandbox}
      FCG_BASE_URL: ${FCG_BASE_URL:-https://open.fusionconnectgroup.com}
      FCG_APP_KEY: ${FCG_APP_KEY:-}
      FCG_APP_SECRET: ${FCG_APP_SECRET:-}
      # === G-Link & F-Link 测试凭证默认值 ===
      FCG_GLINK_APP_KEY: ${FCG_GLINK_APP_KEY:-oapp_dddlm2x3pbg52aaaaaaaaaosvtgayleonisjimuxfi}
      FCG_GLINK_APP_SECRET: ${FCG_GLINK_APP_SECRET:-AIlQp-aLl-vzZe6DnQqbxfn4wMELNMli}
      FCG_FLINK_APP_KEY: ${FCG_FLINK_APP_KEY:-oapp_dddkkjb3si77eaaaaaaaaaqj2h43mxqlz4othvqjtu}
      FCG_FLINK_APP_SECRET: ${FCG_FLINK_APP_SECRET:-TnFQ_oaW9XstozM6g3hImoi7gtgUz-6Y}
      # test/sandbox 部署不允许模拟供应商库存。
      FCG_SANDBOX_HOTEL_SIMULATION: ${FCG_SANDBOX_HOTEL_SIMULATION:-false}
      # === 基础配置 ===
      PORT: ${PORT:-8787}
      DATABASE_PATH: ${DATABASE_PATH:-/data/fusiongo-sandbox.sqlite}
      # 必须由部署环境注入，不在代码中提供固定兜底密钥。
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-1234567890abcdef1234567890abcdef}
      # === 以下为生产准入项，sandbox 可留空 ===
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://obttest.mongoso.vip}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://obttest.mongoso.vip}
      AUTH_MODE: ${AUTH_MODE:-}
      PRODUCTION_DATABASE_PERSISTENT: ${PRODUCTION_DATABASE_PERSISTENT:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-enterprise_credit}
      PAYMENT_CARD_ENABLED: ${PAYMENT_CARD_ENABLED:-false}
      PAYMENT_PSD2_SCA_ENABLED: ${PAYMENT_PSD2_SCA_ENABLED:-false}
      CUSTOMER_SUPPORT_URL: ${CUSTOMER_SUPPORT_URL:-}
      CUSTOMER_SUPPORT_EMAIL: ${CUSTOMER_SUPPORT_EMAIL:-}
      CUSTOMER_SUPPORT_PHONE: ${CUSTOMER_SUPPORT_PHONE:-}
      ALLOW_FOREIGN_CURRENCY_CREDIT: ${ALLOW_FOREIGN_CURRENCY_CREDIT:-false}
      ORDER_MAINTENANCE_ENABLED: ${ORDER_MAINTENANCE_ENABLED:-false}
      ORDER_MAINTENANCE_INTERVAL_MINUTES: ${ORDER_MAINTENANCE_INTERVAL_MINUTES:-5}
      UNPAID_ORDER_TIMEOUT_MINUTES: ${UNPAID_ORDER_TIMEOUT_MINUTES:-30}
      ORDER_COMPENSATION_INTERVAL_MINUTES: ${ORDER_COMPENSATION_INTERVAL_MINUTES:-15}
      ORDER_MAINTENANCE_BATCH_SIZE: ${ORDER_MAINTENANCE_BATCH_SIZE:-50}
      MAINTENANCE_API_KEY: ${MAINTENANCE_API_KEY:-}
    volumes:
      # 将宿主机的 ./app_data 目录挂载到容器的 /data 目录，
      # 容器删除重建后 SQLite 数据仍然保留。
      - ./app_data:/data